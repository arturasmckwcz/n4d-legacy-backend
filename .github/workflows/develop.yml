name: On Merge to Develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Triger Staging Deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: "${{ secrets.PAT }}"
          repository: need4deed-org/n4d-infra
          event-type: Backend-Deployment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies for Code Check
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt -r dev-requirements.txt

      - name: Run Pre-commit
        run: |
          source .venv/bin/activate
          pre-commit run --all-files

      - name: Run Pyright
        run: |
          source .venv/bin/activate
          pyright -p pyrightconfig-ci.json

      - name: Run Unit Tests
        run: |
          source .venv/bin/activate
          pytest -vvv

      - name: Run Code Coverage
        run: |
          source .venv/bin/activate
          pytest --cov --cov-report term --cov-report xml:coverage.xml
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
  build-and-push-alfred:
    if: false
    name: Build and Push Docker Image for Alfred
    runs-on: ubuntu-latest
    needs: build
    env:
      ECR_URI: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_DEFAULT_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

      - name: Build Alfred Docker Image
        run: |
          docker build \
            --build-arg DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY} \
            --build-arg DEBUG=${DEBUG} \
            --build-arg AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --build-arg AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }} \
            --build-arg AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --build-arg AWS_SES_ACCESS_KEY_ID=${AWS_SES_ACCESS_KEY_ID} \
            --build-arg AWS_SES_SECRET_ACCESS_KEY=${AWS_SES_SECRET_ACCESS_KEY} \
            --build-arg AWS_SES_REGION_NAME=${AWS_SES_REGION_NAME} \
            --build-arg AWS_SES_FROM_EMAIL=${AWS_SES_FROM_EMAIL} \
            --build-arg DOMAIN=${DOMAIN} \
            --build-arg SITE_NAME=${SITE_NAME} \
            --build-arg POSTGRES_HOST=${POSTGRES_HOST} \
            --build-arg CELERY_BROKER_URL=${CELERY_BROKER_URL} \
            --build-arg CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND} \
            --build-arg ALFRED_LAST_COMMIT_HASH=${BRANCH_NAME_FOR_TF} \
            --build-arg ENVIRONMENT=${ENVIRONMENT} \
            -t $ECR_URI:${BRANCH_NAME_FOR_TF} .

      - name: Push Alfred Docker Image to ECR
        run: |
          docker push $ECR_URI:${BRANCH_NAME_FOR_TF}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag $ECR_URI:${BRANCH_NAME_FOR_TF} $ECR_URI:main
            docker push $ECR_URI:main
          fi
  build-and-push-e2e-test:
    if: false
    name: Build and Push E2E Test Docker Image
    runs-on: ubuntu-latest
    needs: build
    env:
      ECR_URI: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_TEST_E2E }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials for E2E Test
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.E2E_SECRET_KEY_ID }}
          aws-secret-access-key: ${{ secrets.E2E_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Build E2E Test Docker Image
        run: |
          docker build \
            --build-arg ENVIRONMENT=test \
            --build-arg ALFRED_API_URL="http://api.alfred-test-${BRANCH_NAME_FOR_TF}.local:8000" \
            -t $ECR_URI:${BRANCH_NAME_FOR_TF} -f tests_e2e/Dockerfile .

      - name: Push E2E Test Docker Image
        run: |
          docker push $ECR_URI:${BRANCH_NAME_FOR_TF}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag $ECR_URI:${BRANCH_NAME_FOR_TF} $ECR_URI:main
            docker push $ECR_URI:main
          fi
