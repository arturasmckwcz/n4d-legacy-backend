name: On Merge to Develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SECRET_KEY: "your-secret-key"
  DEBUG: "False"
  AWS_SES_ACCESS_KEY_ID: "your-access-key-id"
  AWS_SES_SECRET_ACCESS_KEY: "your-secret-access-key"
  AWS_SES_REGION_NAME: "your-region-name"
  AWS_SES_FROM_EMAIL: "your-from-email"
  DOMAIN: "your-domain"
  SITE_NAME: "your-site-name"
  POSTGRES_HOST: "postgres.alfred.local"
  ALFRED_LAST_COMMIT_HASH: $CI_COMMIT_SHORT_SHA
  CELERY_RESULT_BACKEND: redis://localhost:6379
  CELERY_BROKER_URL: redis://localhost:6379
  ENVIRONMENT: "PRODUCTION"
  BRANCH_NAME_FOR_TF: "develop"
  UV_VERSION: 0.5
  BASE_LAYER: bookworm-slim
  GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_NEW_ARRIVALS: ${{ secrets.SLACK_CHANNEL_NEW_ARRIVALS }}
  NOTION_SECRET: ${{ secrets.NOTION_SECRET }}
  NOTION_OPPORTUNITIES_ID: ${{ secrets.NOTION_OPPORTUNITIES_ID }}
  NOTION_VOLUNTEERS_ID: ${{ secrets.NOTION_VOLUNTEERS_ID }}
  POSTGRES_PASSWORD: "your-postgres-password"
  POSTGRES_USER: "your-postgres-user"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies for Code Check
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt -r dev-requirements.txt
      - name: Run E2E Tests
        run: |
          source .venv/bin/activate
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=True ALFRED_API_URL=https://pre.api.need4deed.org pytest -vvv tests_e2e || exit 1
          if [ $? -ne 0 ]; then
            echo "E2E tests failed."
            exit 1
          fi
          echo "E2E tests passed."    

      - name: Run Pre-commit
        run: |
          source .venv/bin/activate
          pre-commit run --all-files

      - name: Run Pyright
        run: |
          source .venv/bin/activate
          pyright -p pyrightconfig-ci.json

      - name: Run Unit Tests
        run: |
          source .venv/bin/activate
          pytest -vvv

      - name: Run Code Coverage
        run: |
          source .venv/bin/activate
          pytest --cov --cov-report term --cov-report xml:coverage.xml
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
  staging-deployment:
    name: Prepare Staging Infrastructure
    uses: need4deed-org/n4d-infra/.github/workflows/deploy-infra.yml@main
    with:
      environment: "pre"
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      VPC_TF_STATE_KEY: ${{ secrets.TF_STATE_KEY }}
      BACKEND_TF_STATE_KEY: ${{ secrets.BACKEND_TF_STATE_KEY }}
      AWS_ROLE: ${{ secrets.TF_AWS_ROLE }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      PAT: ${{ secrets.PAT }}
      ECR_HOST: ${{ secrets.ECR_HOST }}
  build-and-push-alfred:
    name: Build and Push Docker Image for Alfred
    runs-on: ubuntu-latest
    needs: build
    env:
      ECR_URI: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_DEFAULT_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

      - name: Build Alfred Docker Image
        run: |
          docker build \
            --build-arg DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY} \
            --build-arg DEBUG=${DEBUG} \
            --build-arg AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --build-arg AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }} \
            --build-arg AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --build-arg AWS_SES_ACCESS_KEY_ID=${AWS_SES_ACCESS_KEY_ID} \
            --build-arg AWS_SES_SECRET_ACCESS_KEY=${AWS_SES_SECRET_ACCESS_KEY} \
            --build-arg AWS_SES_REGION_NAME=${AWS_SES_REGION_NAME} \
            --build-arg AWS_SES_FROM_EMAIL=${AWS_SES_FROM_EMAIL} \
            --build-arg DOMAIN=${DOMAIN} \
            --build-arg SITE_NAME=${SITE_NAME} \
            --build-arg POSTGRES_HOST=${POSTGRES_HOST} \
            --build-arg CELERY_BROKER_URL=${CELERY_BROKER_URL} \
            --build-arg CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND} \
            --build-arg ALFRED_LAST_COMMIT_HASH=${BRANCH_NAME_FOR_TF} \
            --build-arg GLITCHTIP_DSN=${GLITCHTIP_DSN} \
            --build-arg SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}\
            --build-arg SLACK_CHANNEL_NEW_ARRIVALS=${SLACK_CHANNEL_NEW_ARRIVALS}\
            --build-arg NOTION_SECRET=${NOTION_SECRET}\
            --build-arg NOTION_OPPORTUNITIES_ID=${NOTION_OPPORTUNITIES_ID}\
            --build-arg NOTION_VOLUNTEERS_ID=${NOTION_VOLUNTEERS_ID}\
            --build-arg ENVIRONMENT=${ENVIRONMENT} \
            -t $ECR_URI:${BRANCH_NAME_FOR_TF} .

      - name: Push Alfred Docker Image to ECR
        run: |
          docker push $ECR_URI:${BRANCH_NAME_FOR_TF}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag $ECR_URI:${BRANCH_NAME_FOR_TF} $ECR_URI:main
            docker push $ECR_URI:main
          fi
  build-and-push-e2e-test:
    if: false
    name: Build and Push E2E Test Docker Image
    runs-on: ubuntu-latest
    env:
      ECR_URI: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_TEST_E2E }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Log in to Amazon ECR
        run: |
            aws ecr get-login-password --region ${{ secrets.AWS_DEFAULT_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

      - name: Build E2E Test Docker Image
        run: |
          docker build \
            --build-arg ENVIRONMENT=test \
            --build-arg ALFRED_API_URL="https://pre.api.need4deed.org" \
            -t $ECR_URI:${BRANCH_NAME_FOR_TF} -f tests_e2e/Dockerfile .

      - name: Push E2E Test Docker Image
        run: |
          docker push $ECR_URI:${BRANCH_NAME_FOR_TF}
  deploy-aflred:
    name: Deploy Alfred to Staging
    runs-on: ubuntu-latest
    needs: [staging-deployment, build-and-push-alfred]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Deploy Alfred to Staging
        run: |
          SERVICE_NAME="pre-n4d-alfred-service"
          CLUSTER_NAME="pre-n4d-batman-cluster"
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --force-new-deployment
  check-afred-service:
    needs: deploy-aflred
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Wait for ECS Service to be Running
        run: |
          SERVICE_NAME="pre-n4d-alfred-service"
          CLUSTER_NAME="pre-n4d-batman-cluster"
          TIMEOUT=600
          INTERVAL=30
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            TASK_STATUS=$(aws ecs describe-services --cluster $CLUSTER_NAME --services $SERVICE_NAME --query "services[0].deployments[?status=='PRIMARY'].rolloutState" --output text)
            
            if [ "$TASK_STATUS" == "COMPLETED" ]; then
              echo "ECS Service is running successfully."
              exit 0
            fi

            echo "Waiting for ECS Service to be running... ($ELAPSED/$TIMEOUT seconds)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "ECS Service failed to start within the timeout period."
          exit 1
  run-e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    needs: [build-and-push-e2e-test, check-afred-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Dependencies for Code Check
        run: |
            python -m venv .venv
            source .venv/bin/activate
            pip install -r requirements.txt -r dev-requirements.txt    
      - name: Run E2E Tests
        run: |
          source .venv/bin/activate
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=True ALFRED_API_URL=https://pre.api.need4deed.org python3 -m pytest -vvv tests_e2e `|| exit 1
          if [ $? -ne 0 ]; then
            echo "E2E tests failed."
            exit 1
          fi
          echo "E2E tests passed."
   
          
