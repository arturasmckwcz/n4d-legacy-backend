name: Build and Deploy Alfred
description: |
    Reusable workflow for building and deploying Alfred.

on:
    workflow_call:
        inputs:
            environment:
                required: true
                type: string
        secrets:
            ECR_REGISTRY:
                required: true
            ECR_REPOSITORY:
                required: true
            AWS_ACCESS_KEY_ID:
                required: true
            AWS_SECRET_ACCESS_KEY:
                required: true
            AWS_DEFAULT_REGION:
                required: true
            GLITCHTIP_DSN:
                required: true
            NOTION_SECRET:
                required: true
            NOTION_OPPORTUNITIES_ID:
                required: true
            NOTION_VOLUNTEERS_ID:
                required: true
            DJANGO_SECRET_KEY:
                required: true   
            AWS_SES_FROM_EMAIL:
                required: true 
            SLACK_CHANNEL_NEW_ARRIVALS:
                required: true
            SLACK_BOT_TOKEN:
                required: true
          
            

env:
    PYTHON_VERSION: "3.12"
    DEBUG: "False"
    DOMAIN: "api.need4deed.org"
    POSTGRES_HOST: "postgres"
    CELERY_RESULT_BACKEND: redis://localhost:6379
    CELERY_BROKER_URL: redis://localhost:6379
    UV_VERSION: 0.5
    BASE_LAYER: bookworm-slim
    SITE_NAME: "Need4Deed"
    AWS_SES_ACCESS_KEY_ID: "your-access-key-id"
    AWS_SES_SECRET_ACCESS_KEY: "your-secret-access-key"
    AWS_SES_REGION_NAME: "your-region-name"
    AWS_SES_FROM_EMAIL: "your-from-email"
    SLACK_BOT_TOKEN: "your-slack-bot-token"
    SLACK_CHANNEL_NEW_ARRIVALS: "your-slack-channel-id"
    NOTION_SECRET: "your-notion-secret"
    NOTION_OPPORTUNITIES_ID: "your-notion-opportunities-id"
    NOTION_VOLUNTEERS_ID: "your-notion-volunteers-id"
    POSTGRES_PASSWORD: "your-postgres-password"
    POSTGRES_USER: "your-postgres-user"
    POSTGRES_DB: "your-postgres-db"
    GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
  

jobs:
    python-build:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: ${{ env.PYTHON_VERSION }}

        - name: Install Dependencies for Code Check
          run: |
                python -m venv .venv
                source .venv/bin/activate
                pip install -r requirements.txt -r dev-requirements.txt  

        - name: Run Pre-commit
          run: |
                source .venv/bin/activate
                pre-commit run --all-files

        - name: Run Pyright
          run: |
                source .venv/bin/activate
                pyright -p pyrightconfig-ci.json
        - name : Run Unit Tests
          run: |
                source .venv/bin/activate
                pytest -vvv
        - name: Run E2E
          run: |    
                chmod +x ./scripts/run-local-e2e-tests.sh
                ./scripts/run-local-e2e-tests.sh
        - name: Run Code Coverage
          run: |
                source .venv/bin/activate
                pytest --cov --cov-report term --cov-report xml:coverage.xml
        - name: Upload Coverage Report
          uses: actions/upload-artifact@v4
          with:
            name: coverage-report
            path: coverage.xml
                    
    
    docker-build:
        name: Build and Push Docker Image for Alfred
        runs-on: ubuntu-latest
        needs: python-build
        env:
            ECR_URI: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}
        steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

        - name: Log in to Amazon ECR
          run: |
                aws ecr get-login-password --region ${{ secrets.AWS_DEFAULT_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

        - name: Get Latest Commit Hash
          id: get-commit-hash
          run: echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV
        - name: Set Environment Variables
          id: set-env-vars
          run: |
                echo "LAST_COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

                if [ "${{ inputs.environment }}" == "production" ]; then
                    echo "IMAGE_TAG=main" >> $GITHUB_ENV
                else
                    echo "IMAGE_TAG=develop" >> $GITHUB_ENV
                fi
        - name: Build Alfred Docker Image
          run: |
            docker build \
            --build-arg DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }} \
            --build-arg DEBUG=False \
            --build-arg AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --build-arg AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }} \
            --build-arg AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --build-arg AWS_SES_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --build-arg AWS_SES_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --build-arg AWS_SES_REGION_NAME=${{ secrets.AWS_DEFAULT_REGION }} \
            --build-arg AWS_SES_FROM_EMAIL=${{ secrets.AWS_SES_FROM_EMAIL }} \
            --build-arg DOMAIN=${DOMAIN} \
            --build-arg SITE_NAME=${SITE_NAME} \
            --build-arg CELERY_BROKER_URL=${CELERY_BROKER_URL} \
            --build-arg CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND} \
            --build-arg ALFRED_LAST_COMMIT_HASH=${LAST_COMMIT_HASH} \
            --build-arg GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }} \
            --build-arg SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}\
            --build-arg SLACK_CHANNEL_NEW_ARRIVALS=${{ secrets.SLACK_CHANNEL_NEW_ARRIVALS }}\
            --build-arg NOTION_SECRET=${{ secrets.NOTION_SECRET }}\
            --build-arg NOTION_OPPORTUNITIES_ID=${{ secrets.NOTION_OPPORTUNITIES_ID }}\
            --build-arg NOTION_VOLUNTEERS_ID=${{ secrets.NOTION_VOLUNTEERS_ID }}\
            --build-arg ENVIRONMENT=${{ inputs.environment }} \
            -t $ECR_URI:${IMAGE_TAG} .

        - name: Push Alfred Docker Image to ECR
          run: |
            docker push $ECR_URI:${IMAGE_TAG}
