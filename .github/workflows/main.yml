name: On Merge to Main
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
 
  build:
   uses: ./.github/workflows/build-deploy.yml
   with:
    environment: production
   secrets:
    ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
    ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
    GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
    NOTION_SECRET: ${{ secrets.NOTION_SECRET }}
    NOTION_OPPORTUNITIES_ID: ${{ secrets.NOTION_OPPORTUNITIES_ID }}
    NOTION_VOLUNTEERS_ID: ${{ secrets.NOTION_VOLUNTEERS_ID }}
    DJANGO_SECRET_KEY: "secret_key"
    AWS_SES_FROM_EMAIL: "your-from-email"
    SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    SLACK_CHANNEL_NEW_ARRIVALS: ${{ secrets.SLACK_CHANNEL_NEW_ARRIVALS }}

  deploy:
    name: Deploy Alfred to Production Environment
    runs-on: ubuntu-latest
    needs: build
    env:
      SERVICE_NAME: "prod-n4d-alfred-service"
      CLUSTER_NAME: "prod-n4d-cluster"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Deploy Alfred to Production Environment
        run: |
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --force-new-deployment
      - name: Wait for ECS Service to be Running
        run: |
          TIMEOUT=600
          INTERVAL=30
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            TASK_STATUS=$(aws ecs describe-services --cluster $CLUSTER_NAME --services $SERVICE_NAME --query "services[0].deployments[?status=='PRIMARY'].rolloutState" --output text)
            
            if [ "$TASK_STATUS" == "COMPLETED" ]; then
              echo "ECS Service is running successfully."
              exit 0
            fi

            echo "Waiting for ECS Service to be running... ($ELAPSED/$TIMEOUT seconds)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "ECS Service failed to start within the timeout period."
          exit 1  

