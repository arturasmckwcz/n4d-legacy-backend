stages:
  - code-check
  - docker
  - test
  - deploy

variables:
  DJANGO_SECRET_KEY: "your-secret-key"
  DEBUG: "False"
  AWS_SES_ACCESS_KEY_ID: "your-access-key-id"
  AWS_SES_SECRET_ACCESS_KEY: "your-secret-access-key"
  AWS_SES_REGION_NAME: "your-region-name"
  AWS_SES_FROM_EMAIL: "your-from-email"
  DOMAIN: "your-domain"
  SITE_NAME: "your-site-name"
  ALLOWED_HOSTS: "['*']"
  POSTGRES_HOST: "postgres.alfred.local"
  

.pre_commit_before:
  before_script:
    - apt update && apt install -y curl bash git
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH=$PATH:/root/.cargo/bin
    - uv venv
    - source .venv/bin/activate
    - uv pip install -r requirements.txt -r dev-requirements.txt

pre-commit:
  extends: .pre_commit_before
  stage: code-check
  image: python:3.12-slim
  script:
    - pre-commit run --all-files
  rules:
    - when: always

pyright:
  stage: code-check
  extends: .pre_commit_before
  image: python:3.12-slim
  script:
    - pyright -p pyrightconfig-ci.json
  rules:
    - when: always

unit-tests:
  stage: code-check
  extends: .pre_commit_before
  image: python:3.12-slim
  script:
    - pytest -vvv
  rules:
    - when: always

code-coverage:
  stage: code-check
  coverage: '/TOTAL.*? (100(?:\.0+)?\%\|[1-9]?\d(?:\.\d+)?\%)$/'
  extends: .pre_commit_before
  image: python:3.12-slim
  script:
    - pytest --cov --cov-report term --cov-report xml:coverage.xml
  rules:
    - when: always
  needs:
    - unit-tests
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

.docker_before_script:
  image:
    name: docker:26.1
  services:
    - docker:26.1-dind
  variables:
    ECR_URI: $ECR_REGISTRY/$ECR_REPOSITORY
  before_script:
    - echo "http://dl-cdn.alpinelinux.org/alpine/edge/main" >> /etc/apk/repositories
    - echo "http://dl-cdn.alpinelinux.org/alpine/edge/community" >> /etc/apk/repositories
    - apk update
    - apk add --no-cache curl jq unzip aws-cli aws-session-manager-plugin
    - echo "Logging in to Amazon ECR..."
    - aws --version
    - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
    - docker --version

build-and-push:
  extends: .docker_before_script
  stage: docker
  script:
    - echo "Building the Docker image..."
    - docker build --build-arg DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      --build-arg DEBUG=${DEBUG}
      --build-arg AWS_SES_ACCESS_KEY_ID=${AWS_SES_ACCESS_KEY_ID}
      --build-arg AWS_SES_SECRET_ACCESS_KEY=${AWS_SES_SECRET_ACCESS_KEY}
      --build-arg AWS_SES_REGION_NAME=${AWS_SES_REGION_NAME}
      --build-arg AWS_SES_FROM_EMAIL=${AWS_SES_FROM_EMAIL}
      --build-arg DOMAIN=${DOMAIN}
      --build-arg SITE_NAME=${SITE_NAME}
      --build-arg CORS_ALLOW_HEADERS=${CORS_ALLOW_HEADERS}
      --build-arg ALLOWED_HOSTS=${ALLOWED_HOSTS}
      --build-arg POSTGRES_HOST=${POSTGRES_HOST}
      -t $ECR_URI:$CI_COMMIT_REF_SLUG .
    - docker tag $ECR_URI:$CI_COMMIT_REF_SLUG $ECR_URI:latest
    - echo "Pushing the Docker image to ECR..."
    - docker push $ECR_URI:$CI_COMMIT_REF_SLUG
    - docker push $ECR_URI:latest
  rules:
    - when: always


build-and-push-e2e-test:
  extends: .docker_before_script
  variables:
    ECR_URI: $ECR_REGISTRY/$ECR_REPOSITORY_TEST_E2E
  stage: docker
  script:
    - aws configure set aws_access_key_id ${E2E_SECRET_KEY_ID}
    - aws configure set aws_secret_access_key ${E2E_SECRET_ACCESS_KEY}
    - echo "Building the test e2e Docker image..."
    - docker build --build-arg ALFRED_API_URL="http://api.alfred.local:8000" -t $ECR_URI:$CI_COMMIT_REF_SLUG -f tests_e2e/Dockerfile .
    - docker tag $ECR_URI:$CI_COMMIT_REF_SLUG $ECR_URI:main
    - docker tag $ECR_URI:$CI_COMMIT_REF_SLUG $ECR_URI:$CI_COMMIT_SHORT_SHA
    - echo "Pushing the Docker image to ECR ecr e2e..."
    - docker push $ECR_URI:$CI_COMMIT_REF_SLUG
    - docker push $ECR_URI:$CI_COMMIT_SHORT_SHA
    - docker push $ECR_URI:main
  rules:
    - when: always

run-test-e2e:
  extends: .docker_before_script
  stage: test
  variables:
    ECR_URI: $ECR_REGISTRY/$ECR_REPOSITORY
  needs:
    - build-and-push-e2e-test
  script:
    # pull the scheme
    # # change the branch name if needed for testing with another wayne-manor branch
    - git clone -b main https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/need4deed/wayne-manor.git wayne-manor
    - STACK_NAME=batman-${CI_COMMIT_SHORT_SHA}
    # the create stack command has to be one line otherwise it breaks the deployment
    # probably a bug in gitlab
    - aws cloudformation create-stack --stack-name ${STACK_NAME} --template-body file://wayne-manor/e2e-template.yaml --parameters ParameterKey=EnvironmentName,ParameterValue=${CI_COMMIT_SHORT_SHA} --capabilities CAPABILITY_NAMED_IAM
    - echo "Wait for the stack creation"
    - aws cloudformation wait stack-create-complete --stack-name ${STACK_NAME}
    # start the testing section
    - CLUSTER_NAME=$(aws cloudformation describe-stacks --stack-name ${STACK_NAME} --query "Stacks[0].Outputs[?OutputKey=='BatmanClusterName'].OutputValue" --output text)
    - TASK_DEFINITION=$(aws cloudformation describe-stacks --stack-name ${STACK_NAME} --query "Stacks[0].Outputs[?OutputKey=='AlfredE2ETaskDefinitionArn'].OutputValue" --output text)
    - SUBNET_1=$(aws cloudformation describe-stacks --stack-name ${STACK_NAME} --query "Stacks[0].Outputs[?OutputKey=='BatmanPublicSubnet1Id'].OutputValue" --output text)
    - SUBNET_2=$(aws cloudformation describe-stacks --stack-name ${STACK_NAME} --query "Stacks[0].Outputs[?OutputKey=='BatmanPublicSubnet2Id'].OutputValue" --output text)
    - SECURITY_GROUP=$(aws cloudformation describe-stacks --stack-name ${STACK_NAME} --query "Stacks[0].Outputs[?OutputKey=='AlfredE2ESecurityGroupId'].OutputValue" --output text)
    # Get the Alfred task ARN
    - >
      ALFRED_TASK_ARN=$(aws ecs list-tasks
      --cluster $CLUSTER_NAME
      --family alfred-task-definition-${CI_COMMIT_SHORT_SHA}
      --query 'taskArns[0]'
      --output text)
    # Seed the data
    - >
      aws ecs execute-command
      --cluster $CLUSTER_NAME
      --task $ALFRED_TASK_ARN
      --container alfred-container-${CI_COMMIT_SHORT_SHA}
      --command "python3 manage.py seed_data"
      --interactive
    # run the tests in the cloud
    - >
      TASK_ARN=$(aws ecs run-task
      --cluster $CLUSTER_NAME
      --task-definition $TASK_DEFINITION
      --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_1,$SUBNET_2],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}"
      --launch-type FARGATE
      --region eu-central-1
      --query 'tasks[0].taskArn'
      --output text)
    - TASK_ID=$(echo $TASK_ARN | awk -F/ '{print $NF}')
    # wait until the tests are stopped
    - >
      aws ecs wait tasks-stopped
      --cluster $CLUSTER_NAME
      --tasks $TASK_ARN
    # copy the log to the console
    - >
      aws logs get-log-events
      --log-group-name /ecs/alfred-e2e-task-definition-${CI_COMMIT_SHORT_SHA}
      --log-stream-name ecs/alfred-e2e-container-${CI_COMMIT_SHORT_SHA}/$TASK_ID
      --output json
      --region eu-central-1 | jq -r '.events[] | select(.message != null) | .message'
    # get the exit code
    - >
      EXIT_CODE=$(aws ecs describe-tasks
      --cluster $CLUSTER_NAME
      --tasks $TASK_ARN
      --query 'tasks[0].containers[0].exitCode'
      --output text)
    - |
      if [ "$EXIT_CODE" -eq 0 ]; then
        echo "E2E tests exited with exit code 0"
        exit 0
      else
        echo "E2E tests failed with exit code $EXIT_CODE"
        exit 1
      fi
  after_script:
    - !reference [.docker_before_script, before_script]
    - aws cloudformation delete-stack --stack-name batman-${CI_COMMIT_SHORT_SHA}
    - aws cloudformation wait stack-delete-complete --stack-name batman-${CI_COMMIT_SHORT_SHA}
  rules:
    - when: manual

deploy-to-prod:
  extends: .docker_before_script
  stage: deploy
  needs:
    - run-test-e2e
  script:
    - aws ecs update-service --cluster batman-cluster --service alfred-service --force-new-deployment
    - aws ecs wait services-stable --cluster batman-cluster --services alfred-service
  rules:
    - when: manual
  allow_failure: true
