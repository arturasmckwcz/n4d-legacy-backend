services:
  alfred:
    container_name: alfred
    build:
      context: .
      args:
            DJANGO_SECRET_KEY: "dummy_secret_key"
            DEBUG: "False"
            AWS_ACCESS_KEY_ID: "dummy_secret_key"
            AWS_DEFAULT_REGION: "dummy_region"
            AWS_SECRET_ACCESS_KEY: "dummy_secret_key"
            AWS_SES_ACCESS_KEY_ID: "dummy_secret_key"
            AWS_SES_SECRET_ACCESS_KEY: "dummy_secret_key"
            AWS_SES_REGION_NAME: "dummy_region"
            AWS_SES_FROM_EMAIL: "dummy_email"
            DOMAIN: "localhost"
            SITE_NAME: "localhost"
            POSTGRES_HOST: "postgresdb"
            NOTION_SECRET: "secret_notion"
            NOTION_OPPORTUNITIES_ID: "opportunities_id"
            NOTION_VOLUNTEERS_ID: "volunteers_id"
            SLACK_BOT_TOKEN: "slack bot"
            SLACK_CHANNEL_NEW_ARRIVALS: "dasdasdadsa"
            CELERY_BROKER_URL: "redis://localhost:6379"
            CELERY_RESULT_BACKEND: "redis://localhost:6379"
            ALFRED_LAST_COMMIT_HASH: "not local hashes"
            ENVIRONMENT: PRE
            POSTGRES_DB: test_name
            POSTGRES_USER: test_user
            POSTGRES_PASSWORD: test_password
    image: alfred:dev
    environment:
      DJANGO_SECRET_KEY: "dummy_secret_key"
      DEBUG: "true"
      AWS_ACCESS_KEY_ID: "dummy_secret_key"
      AWS_DEFAULT_REGION: "dummy_region"
      AWS_SECRET_ACCESS_KEY: "dummy_secret_key"
      AWS_SES_ACCESS_KEY_ID: "dummy_secret_key"
      AWS_SES_SECRET_ACCESS_KEY: "dummy_secret_key"
      AWS_SES_REGION_NAME: "dummy_region"
      AWS_SES_FROM_EMAIL: "dummy_email"
      DOMAIN: "localhost"
      SITE_NAME: "localhost"
      POSTGRES_HOST: "postgresdb"
      NOTION_SECRET: "secret_notion"
      NOTION_OPPORTUNITIES_ID: "opportunities_id"
      NOTION_VOLUNTEERS_ID: "volunteers_id"
      SLACK_BOT_TOKEN: "slack bot"
      SLACK_CHANNEL_NEW_ARRIVALS: "dasdasdadsa"
      CELERY_BROKER_URL: "redis://localhost:6379"
      CELERY_RESULT_BACKEND: "redis://localhost:6379"
      ALFRED_LAST_COMMIT_HASH: "not local hashes"
      ENVIRONMENT: PRE
      POSTGRES_DB: test_name
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      postgresdb:
        condition: service_healthy
      valkey:
        condition: service_started
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/sanity/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  valkey:
    image: valkey/valkey:alpine
    container_name: valkey

  postgresdb:
    image: postgres
    container_name: pgdb
    environment:
      - POSTGRES_DB=test_name
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_name"]
      interval: 3s
      timeout: 6s
      retries: 5
    ports:
      - "5432:5432"
