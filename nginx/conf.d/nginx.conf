upstream api {
    server alfred:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://api;
    }
}

server {
    listen 443 ssl;

    ssl_certificate /etc/nginx/cert/localhost.crt;
    ssl_certificate_key /etc/nginx/cert/localhost.key;

    location / {
        proxy_pass http://api;
    }
}
