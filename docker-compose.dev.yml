services:
  alfred:
    container_name: alfred
    build: .
    image: alfred:local
    volumes:
      - .:/app
    expose:
      - "8000"
    env_file:
      - .env.local
    command: python manage.py runserver 0.0.0.0:8000

  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/cert:/etc/nginx/cert
    ports:
      - "${API_PORT_NON_TLS:-8080}:80"
      - "${API_PORT:-8443}:443"
    depends_on:
      - alfred
